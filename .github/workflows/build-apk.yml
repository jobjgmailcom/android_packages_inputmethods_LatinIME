name: Build LatinIME APK

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latinime-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build standalone debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and NDK
        run: sdkmanager --install "platforms;android-35" "ndk;25.1.8937393"

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lineage-latinime-android-debug-${{ github.sha }}
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
